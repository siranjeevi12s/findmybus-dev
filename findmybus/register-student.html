<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register Student - FindMyBus</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 460px;
    }
    h1 {
      color: #111827;
      font-size: 24px;
      margin-bottom: 6px;
    }
    p.subtitle {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .form-group { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
      background: #fff;
    }
    input:focus, select:focus { border-color: #3b82f6; }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #3b82f6;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 8px;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .error { color: #ef4444; font-size: 13px; margin-top: 10px; }
    .success { color: #16a34a; font-size: 13px; margin-top: 10px; }
    .link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #6b7280;
    }
    .link a { color: #3b82f6; text-decoration: none; }
    .link a:hover { text-decoration: underline; }
    .note {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 6px;
    }
    .school-badge {
      display: inline-block;
      margin-bottom: 16px;
      padding: 6px 12px;
      background: #eff6ff;
      color: #2563eb;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid #bfdbfe;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="school-badge">Registered school: SEC (siranjeevi12s2@gmail.com)</div>
    <h1>Register Student</h1>
    <p class="subtitle">Fill in the details to create a student profile.</p>

    <form id="regForm">
      <div class="grid-2">
        <div class="form-group">
          <label for="studentName">Student Name</label>
          <input type="text" id="studentName" placeholder="EX: ganesh" required />
        </div>
        <div class="form-group">
          <label for="studentId">Last 2digit of Regester ID</label>
          <input type="text" id="studentId" placeholder="EX: 52" required />
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="grade">Year</label>
          <input type="text" id="grade" placeholder="EX:3rd year" required />
        </div>
        <div class="form-group">
          <label for="section">Section</label>
          <input type="text" id="section" placeholder="EX: A" required />
        </div>
      </div>

      <div class="form-group">
        <label for="parentName">Parent Name</label>
        <input type="text" id="parentName" placeholder="EX: ramesh" required />
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="email"> Email</label>
          <input type="email" id="email" placeholder="example@gmail.com" required />
        </div>
        <div class="form-group">
          <label for="parentPhone">Phone</label>
          <input type="tel" id="parentPhone" placeholder="EX: 9876543210" required />
        </div>
      </div>

      <div class="form-group">
        <label for="busNumber">Bus Number</label>
        <input type="text" id="busNumber" placeholder="EX: 07" required />
        <span class="note">Used to assign the student to a bus route.</span>
      </div>

      <button type="submit" id="submitBtn">Create Student Profile</button>
    </form>

    <div id="msg"></div>

    <!-- <div class="link">
      Already have an account? <a href="login.html">Login</a>
    </div> -->
  </div>

  <script>
    const API_BASE_URL = 'https://app-find-my-bus-gchga4hcdce2evdw.eastasia-01.azurewebsites.net/api';
    const SUCCESS_PAGE_URL = 'https://success12s.netlify.app/';

    const SCHOOL_NAME = 'siranjeevi';
    const SCHOOL_EMAIL = 'siranjeevi12s2@gmail.com';

    const regForm = document.getElementById('regForm');
    const submitBtn = document.getElementById('submitBtn');
    const msg = document.getElementById('msg');

    regForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      msg.className = '';

      const payload = {
        studentName: document.getElementById('studentName').value.trim(),
        studentId: document.getElementById('studentId').value.trim(),
        grade: document.getElementById('grade').value.trim(),
        section: document.getElementById('section').value.trim(),
        parentName: document.getElementById('parentName').value.trim(),
        parentEmail: document.getElementById('email').value.trim(),
        parentPhone: document.getElementById('parentPhone').value.trim(),
        busNumber: document.getElementById('busNumber').value.trim(),
        schoolName: SCHOOL_NAME,
        schoolEmail: SCHOOL_EMAIL,
        busId: '',
        schoolId: '',
        status: 'active',
      };

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!payload.studentName || !payload.studentId || !payload.grade || !payload.section ||
          !payload.parentName || !payload.parentEmail || !payload.parentPhone || !payload.busNumber) {
        showMsg('Please fill in all fields.', 'error');
        return;
      }
      if (!emailRegex.test(payload.parentEmail)) {
        showMsg('Please enter a valid email address.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating...';

      try {
        const res = await fetch(`${API_BASE_URL}/mobile/parent/student`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const data = await res.json();

        if (res.ok && data.success) {
          window.location.href = `${SUCCESS_PAGE_URL}?email=${encodeURIComponent(payload.parentEmail)}&school=${encodeURIComponent(SCHOOL_NAME)}`;
        } else {
          showMsg(data.message || 'Failed to create student profile.', 'error');
        }
      } catch (err) {
        showMsg('An error occurred. Please try again.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Student Profile';
      }
    });

    function showMsg(text, type) {
      msg.textContent = text;
      msg.className = type;
    }
  </script>
</body>
</html>
